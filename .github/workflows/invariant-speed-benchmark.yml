name: invariant-construction-speed-benchmark

on:
  push:
    branches:
      - Ixcononly
    paths:
      - .github/workflows/invariant-speed-benchmark.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Ixcononly

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FANQO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Benchmark invariant constructors
        run: |
          python - <<'PY'
          import gc
          import sys
          import time
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "src"))

          import fanqo as fq

          fq.load(root / "user" / "general_config.py", force=True)

          print("BENCH_ENV order=8 delta_order=1 analysis_cells=1")
          print("BENCH_METHODS", fq.available_methods())

          for method in fq.available_methods():
              fq.clear_cache()
              gc.collect()

              t0 = time.perf_counter()
              result = fq.construct(method, force=True)
              elapsed = time.perf_counter() - t0

              state = result["state"]
              print(
                  "BENCH_RESULT",
                  f"method={method}",
                  f"seconds={elapsed:.6f}",
                  f"basis={len(state['idx_to_vec'])}",
                  f"quad={state['quad_size']}",
                  f"nonquad={state['nonquad_size']}",
                  f"horizontal_slice_only={bool(state.get('horizontal_slice_only', False))}",
                  flush=True,
              )
          PY

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fanqo"
version = "0.3.0.dev0"
description = "FANQO invariant-construction laboratory for nonlinear accelerator quasi-invariants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sympy>=1.11",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
tracking = ["accelerator-toolbox[plot]"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
